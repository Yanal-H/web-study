<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1217" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Foundation — a Med School study toolkit. by Yanal · Cairo 2026" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Foundation" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <title>yanall · Med School Toolkit</title>

    <!-- Pre-paint theme decision (no flash). Ported verbatim from the single-file app. -->
    <script src="/theme-init.js"></script>

    <!--
      Access control lives in the app (src/features/auth), not here.

      This used to hold a pre-React passphrase gate. It was removed because it
      protected nothing: the check ran in the browser, and every chapter was
      bundled into the JavaScript, so anyone who loaded the page already had the
      whole library whether or not they typed the phrase.

      Sign-in is now server-verified (Supabase email codes) and the content is
      fetched only for an authenticated student. A visitor who is not signed in
      receives an empty shell.
    -->

    <!-- Pre-paint shell for the first load, so there is no white flash before React. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0c10;
        color: #6d7482;
        font: 500 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      html[data-theme='paper'] #boot {
        background: #f3f1ea;
        color: #8a94a0;
      }
      #boot.gone {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Loading…</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
