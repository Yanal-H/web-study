function optRows(){return editing.opts.map((o,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
  <button onclick="editing.answer=${i};renderOptList();updatePreview()" title="correct" style="width:24px;height:24px;border-radius:50%;border:2px solid ${editing.answer===i?'var(--good)':'var(--line-2)'};background:${editing.answer===i?'var(--good)':'transparent'};flex:none;display:grid;place-items:center">${editing.answer===i?'<span style="color:#fff;font-size:12px;font-weight:800">✓</span>':'<span style="color:var(--muted);font-size:11px;font-weight:700">'+'ABCDEF'[i]+'</span>'}</button>
  <input type="text" value="${esc(o)}" oninput="editing.opts[${i}]=this.value;updatePreview()" placeholder="Option ${'ABCDEF'[i]}">
  ${editing.opts.length>2?`<button class="ct" style="width:30px;height:30px" onclick="removeOpt(${i})">✕</button>`:''}
</div>`).join('');}
function renderOptList(){const el=$('#optList');if(el)el.innerHTML=optRows();}
function addOpt(){if(editing.opts.length<6){editing.opts.push('');renderEditor();}}
function removeOpt(i){editing.opts.splice(i,1);if(editing.answer>=editing.opts.length)editing.answer=0;renderEditor();}
function setEditType(t){editSync();editing.type=t;renderEditor();}
function editSync(){const f=$('#eFront');if(f)editing.front=f.value;const b=$('#eBack');if(b)editing.back=b.value;const ex=$('#eExtra');if(ex)editing._extraRaw=ex.value;const tg=$('#eTags');if(tg)editing.tags=tg.value.split(',').map(s=>s.trim()).filter(Boolean);updatePreview();}
function wrapCloze(){const ta=$('#eFront');if(!ta)return;const s=ta.selectionStart,en=ta.selectionEnd;const v=ta.value;const sel=v.slice(s,en)||'answer';const n=(v.match(/\{\{c(\d+)::/g)||[]).reduce((m,x)=>Math.max(m,+x.match(/\d+/)[0]),0)+1;ta.value=v.slice(0,s)+'{{c'+n+'::'+sel+'}}'+v.slice(en);editing.front=ta.value;ta.focus();updatePreview();}
function previewCardObj(){const e=editing;return {type:e.type,front:e.front,back:e.back,opts:e.opts,answer:e.answer,extra:e._extraRaw?'<div class="aexp">'+esc(e._extraRaw)+'</div>':'',tags:e.tags};}
function updatePreview(){const c=previewCardObj();const pf=$('#pvFront'),pb=$('#pvBack');if(pf)pf.innerHTML=frontHTML(c)||'<span style="color:var(--muted)">…</span>';if(pb)pb.innerHTML=backHTML(c)||'<span style="color:var(--muted)">…</span>';}
function saveCard(){
  editSync(); const e=editing;
  if(!stripHTML(e.front).trim()){toast('⚠️ Front cannot be empty');return;}
  if(e.type==='cloze'&&!/\{\{c\d+::/.test(e.front)){toast('⚠️ Add at least one cloze {{c1::…}}');return;}
  if(e.type==='mcq'&&e.opts.filter(o=>o.trim()).length<2){toast('⚠️ Need at least 2 options');return;}
  const extra=e._extraRaw&&e._extraRaw.trim()?'<div class="aexp">'+esc(e._extraRaw.trim())+'</div>':(e.type==='mcq'?'':e.extra||'');
  if(e._id){
    const c=state.cards.find(x=>x.id===e._id);
    Object.assign(c,{type:e.type,front:e.front,back:e.back,extra:e.type==='mcq'&&e._extraRaw?('<div class="aexp">'+esc(e._extraRaw)+'</div>'):extra,opts:e.type==='mcq'?e.opts.filter(o=>o.trim()):null,answer:Math.min(e.answer,(e.opts.filter(o=>o.trim()).length||1)-1),deckId:e.deckId,tags:e.tags});
    save();toast('✓ Saved');go(editReturn);
  }else{
    const card={id:uid(),deckId:e.deckId,type:e.type,front:e.front,back:e.back,extra:e.type==='mcq'&&e._extraRaw?('<div class="aexp">'+esc(e._extraRaw)+'</div>'):extra,opts:e.type==='mcq'?e.opts.filter(o=>o.trim()):null,answer:Math.min(e.answer,(e.opts.filter(o=>o.trim()).length||1)-1),tags:e.tags,state:'new',interval:0,ease:state.cfg.startEase,reps:0,lapses:0,stepIndex:0,due:Date.now(),created:Date.now(),flag:0,suspended:false,buriedUntil:0,lastReviewed:0,history:[]};
    state.cards.push(card);save();toast('✓ Card added');
    editing={_id:null,type:e.type,deckId:e.deckId,front:'',back:'',extra:'',_extraRaw:'',opts:['','','',''],answer:0,tags:e.tags};renderEditor();
  }
}
function deleteCard(){if(!editing._id)return;if(!confirm('Delete this card?'))return;state.cards=state.cards.filter(c=>c.id!==editing._id);save();toast('Deleted');go(editReturn);}

/* ---------- STATS ---------- */
function retention(days){const since=Date.now()-days*DAY;const r=state.rev.filter(x=>x.rev&&x.t>=since);if(!r.length)return null;return Math.round(r.filter(x=>x.r>1).length/r.length*100);}
function streakCount(){const has=k=>{const x=state.daily[k];return x&&(dayTotal(x)>0||x.new>0||x.rev>0);};let n=0;const d=new Date();d.setHours(0,0,0,0);if(!has(dateKey(d.getTime())))d.setDate(d.getDate()-1);while(has(dateKey(d.getTime()))){n++;d.setDate(d.getDate()-1);}return n;}
function heatHTML(days){
  const cells=[]; const today=startOfToday();
  const start=today-(days-1)*DAY; const sd=new Date(start); const pad=sd.getDay();
  for(let i=0;i<pad;i++)cells.push('<div class="cell" style="visibility:hidden"></div>');
  for(let i=0;i<days;i++){const ts=start+i*DAY;const k=dateKey(ts);const n=dayTotal(state.daily[k]);const lvl=n===0?0:n<5?1:n<10?2:n<20?3:4;cells.push(`<div class="cell" style="background:var(--heat-${lvl})" title="${n} review${n!==1?'s':''} · ${new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}"></div>`);}
  return `<div class="heat">${cells.join('')}</div>`;
}
function renderStats(){
  const total=state.cards.length, susp=state.cards.filter(c=>c.suspended).length;
  const mNew=state.cards.filter(c=>!c.suspended&&c.state==='new').length;
  const mLearn=state.cards.filter(c=>!c.suspended&&(c.state==='learning'||c.state==='relearning')).length;
  const mYoung=state.cards.filter(c=>!c.suspended&&c.state==='review'&&c.interval<21).length;
  const mMature=state.cards.filter(c=>!c.suspended&&c.state==='review'&&c.interval>=21).length;
  const act=mNew+mLearn+mYoung+mMature||1;
  const seg=[['New','var(--easy)',mNew],['Learning','var(--again)',mLearn],['Young','var(--hard)',mYoung],['Mature','var(--good)',mMature]];
  let acc=0; const stops=seg.map(([n,col,v])=>{const a=acc/act*360;acc+=v;const b=acc/act*360;return `${col} ${a}deg ${b}deg`;}).join(',');
  const totalRev=state.rev.length; const ret30=retention(30), ret7=retention(7);
  const studiedToday=dayTotal(state.daily[todayKey()]); const timeToday=(state.daily[todayKey()]||{}).ms||0;
  // forecast 30d
  const fc=Array(30).fill(0); state.cards.filter(c=>!c.suspended&&c.state==='review').forEach(c=>{let off=Math.floor((c.due-startOfToday())/DAY);if(off<0)off=0;if(off<30)fc[off]++;});
  const fcMax=Math.max(1,...fc);
  // reviews per day 14
  const rpd=[]; for(let i=13;i>=0;i--){const ts=startOfToday()-i*DAY;rpd.push({k:ts,n:dayTotal(state.daily[dateKey(ts)])});}
  const rMax=Math.max(1,...rpd.map(x=>x.n));
  $('#stats').innerHTML=`
  <div class="page-head"><span class="eyebrow">Analytics</span><h1>Your progress</h1><p>Insights from ${totalRev.toLocaleString()} total reviews.</p></div>
  <div class="stat-grid">
    <div class="stat-card"><div class="ic">${ICON.fire}</div><div class="sv" style="color:var(--hard)">${streakCount()}</div><div class="sl">Day streak</div></div>
    <div class="stat-card"><div class="ic">${ICON.check}</div><div class="sv">${studiedToday}</div><div class="sl">Reviewed today</div><div class="sub">${fmtTime(timeToday)} studied</div></div>
    <div class="stat-card"><div class="ic">${ICON.target}</div><div class="sv" style="color:var(--good)">${ret30==null?'—':ret30+'%'}</div><div class="sl">Retention 30d</div><div class="sub">7d: ${ret7==null?'—':ret7+'%'}</div></div>
    <div class="stat-card"><div class="ic">${ICON.layers}</div><div class="sv">${total}</div><div class="sl">Total cards</div><div class="sub">${susp} suspended</div></div>
  </div>
  <div class="panel"><h3>Review heatmap</h3><div class="ph-sub">Last 17 weeks of activity</div>${heatHTML(119)}<div class="heat-legend">Less ${[0,1,2,3,4].map(l=>`<i style="background:var(--heat-${l})"></i>`).join('')} More</div></div>
  <div class="panel"><h3>Card maturity</h3><div class="ph-sub">Distribution of ${act} active cards</div>
    <div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div class="center"><b>${mMature}</b><span>mature</span></div></div>
      <div class="legend">${seg.map(([n,col,v])=>`<div class="li"><i style="background:${col}"></i>${n}<b>${v}</b></div>`).join('')}</div></div></div>
  <div class="panel"><h3>Due forecast</h3><div class="ph-sub">Review cards coming due over the next 30 days</div>
    <div class="bars">${fc.map((v,i)=>`<div class="bar-col"><div class="bar ${v?'':'empty'}" style="height:${v/fcMax*100}%"></div><div class="blabel">${i===0?'今':i%5===0?'+'+i:''}</div></div>`).join('')}</div></div>
  <div class="panel"><h3>Reviews per day</h3><div class="ph-sub">Last 14 days</div>
    <div class="bars">${rpd.map(x=>`<div class="bar-col"><div class="bval">${x.n||''}</div><div class="bar ${x.n?'':'empty'}" style="height:${x.n/rMax*100}%"></div><div class="blabel">${new Date(x.k).toLocaleDateString(undefined,{weekday:'narrow'})}</div></div>`).join('')}</div></div>`;
}

function themeChip(id,label,cols){return `<div class="theme-chip ${state.theme===id?'on':''}" onclick="setTheme('${id}')"><div class="sw">${cols.map(c=>`<i style="background:${c}"></i>`).join('')}</div><span>${label}</span></div>`;}
function setTheme(t){state.theme=t;document.body.dataset.theme=t;document.querySelector('meta[name=theme-color]').setAttribute('content',getComputedStyle(document.body).getPropertyValue('--bg-0').trim());save();renderSettings();}
function cycleTheme(){const o=['midnight','paper','forest'];setTheme(o[(o.indexOf(state.theme)+1)%o.length]);toast('Theme: '+state.theme);}
function addDeck(){const name=prompt('Deck name:');if(!name)return;const palette=['#8b9eff','#7be0d6','#ff9ec9','#9ece6a','#f7768e','#74c7ec','#e0af68','#cba6f7','#ff9e64','#a6e3a1'];state.decks.push({id:'d'+Date.now().toString(36),name:name.trim(),color:palette[state.decks.length%palette.length],desc:''});save();(curScreen==='settings'?renderSettings:renderHome)();toast('Deck created');}
function renameDeck(id){const d=deckById(id);const n=prompt('Rename deck:',d.name);if(!n)return;d.name=n.trim();save();renderSettings();}
function deleteDeck(id){const n=state.cards.filter(c=>c.deckId===id).length;if(state.decks.length<=1){toast('Keep at least one deck');return;}if(!confirm('Delete this deck'+(n?' and its '+n+' cards':'')+'?'))return;state.cards=state.cards.filter(c=>c.deckId!==id);state.decks=state.decks.filter(d=>d.id!==id);save();renderSettings();toast('Deck deleted');}
function exportJSON(){
  const payload={recall_export:true,schemaVersion:SCHEMA_VERSION,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='recall-v'+SCHEMA_VERSION+'-'+todayKey()+'.json';
  a.click();
  toast('Backup downloaded (schema v'+SCHEMA_VERSION+')');
}
$('#importFile').addEventListener('change',function(){
  const f=this.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=tryParse(r.result);
      if(!parsed)throw new Error('parse');
      // Support both versioned export wrapper and bare state objects
      const raw=parsed.recall_export?parsed.state:parsed;
      if(!raw||!raw.cards)throw new Error('no cards');
      const importedState=migrate({...raw,cfg:{...state_defaults,...(raw.cfg||{})}});
      showImportDialog(importedState);
    }catch(e){toast('⚠️ Invalid backup file');}
  };
  r.readAsText(f); this.value='';
});

function mergeImport(importedState){
  const localMap=new Map(state.cards.map(c=>[c.id,c]));
  let added=0,updated=0,skipped=0;
  importedState.cards.forEach(ic=>{
    const lc=localMap.get(ic.id);
    if(!lc){state.cards.push(ic);added++;}
    else{
      const iNewer=(ic.lastReviewed||ic.created||0)>(lc.lastReviewed||lc.created||0);
      if(iNewer){Object.assign(lc,ic);updated++;}
      else skipped++;
    }
  });
  // Merge decks (add any new ones from import)
  const localDeckIds=new Set(state.decks.map(d=>d.id));
  importedState.decks.forEach(d=>{if(!localDeckIds.has(d.id))state.decks.push(d);});
  // Merge daily stats (keep local; fill in missing days from import)
  Object.keys(importedState.daily||{}).forEach(k=>{if(!state.daily[k])state.daily[k]=importedState.daily[k];});
  save(); go('home');
  toast('Merged: +'+added+' new, '+updated+' updated, '+skipped+' unchanged');
}

function showImportDialog(importedState){
  const lc=state.cards.length, ic=importedState.cards.length;
  const localIds=new Set(state.cards.map(c=>c.id));
  const newCount=importedState.cards.filter(c=>!localIds.has(c.id)).length;
  const commonCount=ic-newCount;
  const bg=document.createElement('div');
  bg.className='modal-bg on';
  bg.innerHTML=`<div class="modal">
    <h3>${ICON.upload} Import backup</h3>
    <p style="color:var(--text-2);font-size:13.5px;line-height:1.7;margin-bottom:18px">
      File: <b>${ic}</b> cards &nbsp;·&nbsp; Local: <b>${lc}</b> cards<br>
      <b>${newCount}</b> new to add &nbsp;·&nbsp; <b>${commonCount}</b> in common (newest-wins)
    </p>
    <div style="display:flex;flex-direction:column;gap:9px">
      <button class="btn btn-primary" id="_imp_merge">Merge (keep newer reviews)</button>
      <button class="btn btn-ghost" id="_imp_replace">Replace — overwrite all local data</button>
      <button class="btn btn-ghost" id="_imp_cancel">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#_imp_merge').onclick=()=>{document.body.removeChild(bg);mergeImport(importedState);};
  bg.querySelector('#_imp_replace').onclick=()=>{
    if(!confirm('This will overwrite ALL local cards and progress. Are you sure?'))return;
    state=importedState; document.body.dataset.theme=state.theme||'midnight';
    save(); document.body.removeChild(bg); go('home'); toast('Backup restored (replaced)');
  };
  bg.querySelector('#_imp_cancel').onclick=()=>document.body.removeChild(bg);
}

function resetAll(){if(!confirm('Reset ALL cards and progress to the original Internal Medicine deck? This cannot be undone.'))return;state=freshState();save();go('home');toast('Reset complete');}

/* ---------- synthetic deck generator (performance testing) ---------- */
function generateSyntheticDeck(count){
  count=count||1000;
  const id='d_synth_'+Date.now().toString(36);
  state.decks.push({id,name:'Synthetic Test ('+count+')',color:'#a0a0a0',desc:'Auto-generated for performance testing'});
  const topics=['Cardiology','Pulmonology','Neurology','Gastroenterology','Nephrology','Endocrinology','Hematology','Infectious Disease','Rheumatology','Dermatology'];
  const types=['basic','cloze','mcq'];
  const now=Date.now();
  for(let i=0;i<count;i++){
    const tp=types[i%3],topic=topics[i%topics.length];
    let extra={};
    if(tp==='basic'){extra={type:'basic',front:'[Synth '+i+'] In '+topic+': what is the mechanism of finding X?',back:'[Synth '+i+'] Finding X arises from pathway Y in '+topic+'.',opts:null,answer:0};}
    else if(tp==='cloze'){extra={type:'cloze',front:'[Synth '+i+'] In '+topic+', {{c1::finding X}} is the hallmark finding.',back:'',opts:null,answer:0};}
    else{extra={type:'mcq',front:'[Synth '+i+'] In '+topic+', which is most correct?',back:'',extra:'',opts:['Option A','Option B','Option C','Option D'],answer:i%4};}
    state.cards.push(Object.assign({id:uid(),deckId:id,tags:[topic,'synthetic'],state:'new',interval:0,ease:state.cfg.startEase,reps:0,lapses:0,stepIndex:0,due:now+i,created:now+i,flag:0,suspended:false,buriedUntil:0,lastReviewed:0,history:[]},extra));
  }
  save(); go('home'); toast('Generated '+count+' synthetic cards');
}

/* ---------- auto-backup browser & restore ---------- */
function getBackupSlots(){
  const last=+(safeGet(BAK_IDX_KEY)||0);
  const slots=[];
  for(let i=0;i<BAK_SLOTS;i++){
    const idx=(last-i+BAK_SLOTS)%BAK_SLOTS;
    const raw=safeGet(BAK_KEY+idx);
    if(!raw)continue;
    const s=tryParse(raw);
    if(!s||!s.cards)continue;
    slots.push({idx,age:i,ts:s._bakAt||0,cards:s.cards.length,sizeKB:Math.round(raw.length/1024)});
  }
  return slots;
}

function showAutoBackups(){
  const slots=getBackupSlots();
  if(!slots.length){toast('No auto-backups found yet');return;}
  const bg=document.createElement('div');
  bg.className='modal-bg on';
  const rows=slots.map(s=>{
    const ago=s.ts?(fmtAgo(s.ts)):'unknown time';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft)">
      <div><b style="font-size:13.5px">${s.cards} cards</b> <span style="color:var(--muted);font-size:12px">· ${s.sizeKB}KB · ${ago}</span></div>
      <button class="btn btn-ghost btn-sm" onclick="restoreBackupSlot(${s.idx},this.closest('.modal-bg'))">Restore</button>
    </div>`;
  }).join('');
  bg.innerHTML=`<div class="modal"><h3>${ICON.layers} Auto-backups</h3>
    <p style="color:var(--muted);font-size:12.5px;margin-bottom:14px">Up to ${BAK_SLOTS} checkpoints, one per 10-minute session block.</p>
    ${rows}
    <button class="btn btn-ghost btn-sm" style="margin-top:16px;width:100%" onclick="this.closest('.modal-bg').remove()">Close</button>
  </div>`;
  document.body.appendChild(bg);
}

function restoreBackupSlot(idx,modalEl){
  if(!confirm('Restore this backup? Your current data will be overwritten.'))return;
  const raw=safeGet(BAK_KEY+idx);
  const s=tryParse(raw);
  if(!s||!s.cards){toast('Backup slot is empty or corrupted');return;}
  try{
    state=migrate(s); state.cfg={...state_defaults,...state.cfg};
    document.body.dataset.theme=state.theme||'midnight';
    delete state._bakAt; save();
    if(modalEl)modalEl.remove();
    go('home'); toast('Backup restored successfully');
  }catch(e){toast('Could not restore this backup');}
}

function fmtAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return s+'s ago';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}

/* ---------- TTS ---------- */
function speakSide(side){const c=current;if(!c)return;let txt;if(side==='back'){txt=c.type==='cloze'?stripHTML(renderClozeBack(c.front)):c.type==='mcq'?('Correct answer: '+c.opts[c.answer]):stripHTML(c.back);}else{txt=c.type==='cloze'?stripHTML(c.front.replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g,' blank ')):c.type==='mcq'?(stripHTML(c.front)+'. Options: '+c.opts.join(', ')):stripHTML(c.front);}speak(txt);}
function speak(t){if(!('speechSynthesis'in window)){toast('Speech not supported');return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.98;u.onstart=()=>speaking=true;u.onend=()=>speaking=false;window.speechSynthesis.speak(u);}
function stopSpeak(){if('speechSynthesis'in window)window.speechSynthesis.cancel();speaking=false;}

/* ---------- toast ---------- */
let toastN=0;
function toast(msg,undoFn){const id='t'+(toastN++);const el=document.createElement('div');el.className='toast';el.id=id;el.innerHTML=esc(msg)+(undoFn?' <span class="undo">Undo</span>':'');$('#toasts').appendChild(el);if(undoFn)el.querySelector('.undo').onclick=()=>{undoFn();el.remove();};setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},undoFn?5000:2200);}

/* ---------- confetti ---------- */
function fireConfetti(){const cv=$('#confetti');cv.style.display='block';const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#8b9eff','#c4a7ff','#7be0d6','#ff9ec9','#ffb454','#56d4a0'];const P=[];for(let i=0;i<140;i++)P.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-15-4,r:Math.random()*7+3,c:cols[i%cols.length],a:1,rot:Math.random()*6,vr:(Math.random()-.5)*.4});let t=0;function fr(){ctx.clearRect(0,0,cv.width,cv.height);t++;P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.a=Math.max(0,1-t/90);ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});if(t<95)requestAnimationFrame(fr);else cv.style.display='none';}fr();}

/* ---------- streak UI / kbd ---------- */
function updateStreakUI(){const n=streakCount();$('#streakNum').textContent=n;$('#streakBox').classList.toggle('cold',n===0);}
function showKbd(){$('#kbdModal').classList.add('on');}
function closeKbd(){$('#kbdModal').classList.remove('on');}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if($('#kbdModal').classList.contains('on')&&e.key==='Escape')return closeKbd();
  if(curScreen==='study'&&current){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();return;}
    if(flipped&&session.mode!=='cram'&&['1','2','3','4'].includes(e.key)){grade(+e.key);return;}
    if(e.key.toLowerCase()==='u'){undo();return;}
    if(e.key.toLowerCase()==='e'){editCurrent();return;}
    if(e.key.toLowerCase()==='r'){speakSide(flipped?'back':'front');return;}
    if(e.key.toLowerCase()==='f'){setFlag(current.flag===1?0:1);return;}
    if(e.key==='@'||(e.shiftKey&&e.key==='2')){suspendCurrent();return;}
    if(e.key==='Escape'){endSession();return;}
  }
  if(curScreen!=='study'){
    if(e.key==='?'){showKbd();return;}
    if(e.key.toLowerCase()==='d')go('home');
    else if(e.key.toLowerCase()==='b')go('browse');
    else if(e.key.toLowerCase()==='s')go('stats');
    else if(e.key.toLowerCase()==='t')cycleTheme();
    else if(e.key.toLowerCase()==='a')newCard();
  }
});

/* ---------- init ---------- */
updateStreakUI();
renderHome();
