function openExamForm(id){
  const ex=id?state.exams.find(e=>e.id===id):null;
  _examDraft=ex?{id:ex.id,name:ex.name,deckId:ex.deckId,date:ex.date}:{id:null,name:'',deckId:'all',date:''};
  renderSettings();
}
function cancelExamForm(){_examDraft=null;renderSettings();}
function saveExam(){
  const name=(($('#exName')||{}).value||'').trim();
  const deckId=(($('#exDeck')||{}).value)||'all';
  const date=(($('#exDate')||{}).value)||'';
  if(!parseExamDate(date)){toast('Pick an exam date first');return;}
  if(deckId!=='all'&&!deckById(deckId)){toast('That deck no longer exists');return;}
  const finalName=name||(deckId==='all'?'Exam':deckShortName((deckById(deckId)||{}).name||'Exam')+' exam');
  if(_examDraft&&_examDraft.id){const ex=state.exams.find(e=>e.id===_examDraft.id);if(ex){ex.name=finalName;ex.deckId=deckId;ex.date=date;}}
  else state.exams.push({id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name:finalName,deckId,date});
  _examDraft=null; save(); renderSettings(); toast('Exam saved');
}
function removeExam(id){
  const ex=state.exams.find(e=>e.id===id); if(!ex)return;
  if(!confirm('Remove "'+(ex.name||'this exam')+'"? Your cards and progress are not affected.'))return;
  state.exams=state.exams.filter(e=>e.id!==id); _examDraft=null; save(); renderSettings(); toast('Exam removed');
}

/* ============================================================
   IMAGE OCCLUSION  (card type: 'occlusion')
   One image -> many boxes; each box becomes a card. "Hide all, guess
   one": the front hides every box and marks the active one with "?",
   the back reveals just the active box. Images are stored once in
   state.images (deduped by id, auto-downscaled) and referenced by cards
   so N sibling cards share a single image. Box coords are fractions
   (0..1) of the image so they scale to any rendered width.
   Recall JSON backup carries images; Anki TSV does not (skipped on export).
   card: { type:'occlusion', imageId, groupId, masks:[{id,x,y,w,h,label}],
           target:<maskId>, occMode:'hideAll', label, front(=label), back }
   ============================================================ */
function ioRenderHTML(imgObj,masks,target,reveal,back){
  if(!imgObj||!imgObj.src)return '<div class="atext" style="color:var(--muted)">[image missing — restore from a JSON backup]</div>';
  const ms=(masks||[]).map(m=>{
    const isT=m.id===target;
    const cls='io-mask '+(isT?(reveal?'io-revealed':'io-q'):'io-cover');
    const inner=(isT&&!reveal)?'<span class="io-qm">?</span>':'';
    return '<div class="'+cls+'" style="left:'+(m.x*100)+'%;top:'+(m.y*100)+'%;width:'+(m.w*100)+'%;height:'+(m.h*100)+'%">'+inner+'</div>';
  }).join('');
  const cap=(reveal&&back)?'<div class="aexp" style="margin-top:12px">'+esc(back)+'</div>':'';
  return '<div class="io-wrap"><img class="io-img" src="'+imgObj.src+'" alt=""><div class="io-masks">'+ms+'</div></div>'+cap;
}
function occlusionHTML(card,reveal){return ioRenderHTML(state.images&&state.images[card.imageId],card.masks,card.target,reveal,reveal?card.back:'');}

function newOcclusionCard(deckId,imageId,groupId,masks,target,label,back){
  const m=masks.find(x=>x.id===target);
  return {id:uid(),deckId,type:'occlusion',imageId,groupId,masks,target,occMode:'hideAll',
    label:label||'',front:(label||'Image occlusion')+(m&&m.label?(' · '+m.label):''),back:back||'',extra:'',opts:null,answer:0,tags:[],
    state:'new',interval:0,ease:state.cfg.startEase,reps:0,lapses:0,stepIndex:0,due:Date.now(),created:Date.now(),flag:0,suspended:false,buriedUntil:0,lastReviewed:0,history:[]};
}
function gcImages(){
  if(!state.images)return 0;
  const used=new Set(state.cards.filter(c=>c.type==='occlusion'&&c.imageId).map(c=>c.imageId));
  let n=0; Object.keys(state.images).forEach(k=>{if(!used.has(k)){delete state.images[k];n++;}});
  return n;
}
function saveOcclusion(){
  const e=editing;
  if(!e._occImg||!e._occImageId){toast('Add an image first');return;}
  const masks=(e._occMasks||[]).filter(m=>m.w>=0.02&&m.h>=0.02).map(m=>({id:m.id,x:+m.x,y:+m.y,w:+m.w,h:+m.h,label:(m.label||'').trim()}));
  if(!masks.length){toast('Draw at least one box to hide');return;}
  state.images=state.images||{};
  state.images[e._occImageId]={src:e._occImg.src,w:e._occImg.w,h:e._occImg.h};
  const label=(e.label||'').trim(), back=(e._occBack||'').trim();
  if(e._occGroupId){
    const gid=e._occGroupId;
    const siblings=state.cards.filter(c=>c.type==='occlusion'&&c.groupId===gid);
    const byTarget=new Map(siblings.map(c=>[c.target,c]));
    const keep=new Set();
    masks.forEach(m=>{
      const ex=byTarget.get(m.id);
      if(ex){ // survivor — preserve its scheduling, refresh shared data
        ex.masks=masks; ex.imageId=e._occImageId; ex.label=label; ex.back=back;
        ex.front=(label||'Image occlusion')+(m.label?(' · '+m.label):''); keep.add(ex.id);
      }else{ const nc=newOcclusionCard(e.deckId,e._occImageId,gid,masks,m.id,label,back); state.cards.push(nc); keep.add(nc.id); }
    });
    state.cards=state.cards.filter(c=>!(c.type==='occlusion'&&c.groupId===gid&&!keep.has(c.id)));
    gcImages(); save(); toast('Image occlusion updated · '+masks.length+' card'+(masks.length>1?'s':'')); go(editReturn);
  }else{
    const gid='iog'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
    masks.forEach(m=>state.cards.push(newOcclusionCard(e.deckId,e._occImageId,gid,masks,m.id,label,back)));
    save(); toast('Added '+masks.length+' image-occlusion card'+(masks.length>1?'s':''));
    editing={_id:null,type:'occlusion',deckId:e.deckId,tags:(e.tags||[]).slice(),opts:['','','',''],answer:0,_occImg:null,_occImageId:null,_occMasks:[],_occGroupId:null,label:'',_occBack:''};
    renderEditor();
  }
}

/* ---- authoring: load + downscale image (browser-only; uses canvas) ---- */
function ioLoadImageFile(file){
  if(!file)return;
  if(!/^image\//.test(file.type||'')){toast('Please choose an image file');return;}
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1400; let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      const scale=Math.min(1,MAX/Math.max(w,h)); w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      let src;
      try{ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); src=cv.toDataURL('image/jpeg',0.82); }
      catch(_){ src=r.result; } // fall back to original if canvas is blocked
      editing._occImageId='img'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      editing._occImg={src,w,h};
      if(!editing._occMasks)editing._occMasks=[];
      renderEditor();
      toast('Image added — drag boxes over what to hide');
    };
    img.onerror=()=>toast('Could not read that image');
    img.src=r.result;
  };
  r.onerror=()=>toast('Could not read that file');
  r.readAsDataURL(file);
}

/* ---- authoring: box drawing surface (Pointer Events: touch + mouse) ---- */
function ioEditMaskHTML(m){return '<div class="io-edit-mask" data-mid="'+m.id+'" style="left:'+(m.x*100)+'%;top:'+(m.y*100)+'%;width:'+(m.w*100)+'%;height:'+(m.h*100)+'%"><div class="io-del">×</div><div class="io-handle"></div></div>';}
function ioMaskListHTML(){
  const ms=editing._occMasks||[];
  if(!ms.length)return '<div class="exam-empty">No boxes yet — drag on the image to hide a region.</div>';
  return '<div class="ph-sub" style="margin:2px 0 8px">'+ms.length+' box'+(ms.length>1?'es':'')+' → '+ms.length+' card'+(ms.length>1?'s':'')+'</div>'+
    ms.map((m,i)=>'<div class="io-mask-row"><span class="io-mask-idx">'+(i+1)+'</span><input type="text" placeholder="Label (optional)" value="'+esc(m.label||'')+'" oninput="ioSetLabel(\''+m.id+'\',this.value)"><button class="ct" style="width:30px;height:30px" onclick="ioDelMask(\''+m.id+'\')">✕</button></div>').join('');
}
function ioSetLabel(id,v){const m=(editing._occMasks||[]).find(x=>x.id===id);if(m)m.label=v;}
function ioDelMask(id){editing._occMasks=(editing._occMasks||[]).filter(m=>m.id!==id);ioRefresh();}
function ioClearMasks(){if(!editing._occMasks||!editing._occMasks.length)return;if(!confirm('Remove all boxes from this image?'))return;editing._occMasks=[];ioRefresh();}
function ioPaintMasks(){
  const cont=$('#ioEditMasks'); if(!cont)return;
  (editing._occMasks||[]).forEach(m=>{const el=cont.querySelector('[data-mid="'+m.id+'"]');if(el){el.style.left=(m.x*100)+'%';el.style.top=(m.y*100)+'%';el.style.width=(m.w*100)+'%';el.style.height=(m.h*100)+'%';}});
}
function ioRefresh(){
  const cont=$('#ioEditMasks'); if(cont)cont.innerHTML=(editing._occMasks||[]).map(ioEditMaskHTML).join('');
  const list=$('#ioMaskList'); if(list)list.innerHTML=ioMaskListHTML();
  updatePreview();
}
let _ioDrag=null;
function ioFrac(ev,wrap){const r=wrap.getBoundingClientRect();const x=r.width?(ev.clientX-r.left)/r.width:0,y=r.height?(ev.clientY-r.top)/r.height:0;return {x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y))};}
function ioBindEditor(){
  const wrap=$('#ioEdit'); if(!wrap)return;
  wrap.onpointerdown=e=>{
    if(isReadonly())return;
    const del=e.target.closest('.io-del'), handle=e.target.closest('.io-handle'), maskEl=e.target.closest('.io-edit-mask');
    if(del&&maskEl){e.preventDefault();editing._occMasks=(editing._occMasks||[]).filter(m=>m.id!==maskEl.dataset.mid);ioRefresh();return;}
    const p=ioFrac(e,wrap); const ms=editing._occMasks||(editing._occMasks=[]);
    if(handle&&maskEl){const m=ms.find(x=>x.id===maskEl.dataset.mid);if(m)_ioDrag={mode:'resize',id:m.id,sx:p.x,sy:p.y,ow:m.w,oh:m.h};}
    else if(maskEl){const m=ms.find(x=>x.id===maskEl.dataset.mid);if(m)_ioDrag={mode:'move',id:m.id,sx:p.x,sy:p.y,ox:m.x,oy:m.y};}
    else{const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);ms.push({id,x:p.x,y:p.y,w:0,h:0,label:''});_ioDrag={mode:'draw',id,sx:p.x,sy:p.y};ioRefresh();}
    try{wrap.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  };
  wrap.onpointermove=e=>{
    if(!_ioDrag)return; const p=ioFrac(e,wrap); const m=(editing._occMasks||[]).find(x=>x.id===_ioDrag.id); if(!m)return;
    if(_ioDrag.mode==='draw'){m.x=Math.min(_ioDrag.sx,p.x);m.y=Math.min(_ioDrag.sy,p.y);m.w=Math.abs(p.x-_ioDrag.sx);m.h=Math.abs(p.y-_ioDrag.sy);}
    else if(_ioDrag.mode==='move'){m.x=Math.max(0,Math.min(1-m.w,_ioDrag.ox+(p.x-_ioDrag.sx)));m.y=Math.max(0,Math.min(1-m.h,_ioDrag.oy+(p.y-_ioDrag.sy)));}
    else{m.w=Math.max(0.01,Math.min(1-m.x,_ioDrag.ow+(p.x-_ioDrag.sx)));m.h=Math.max(0.01,Math.min(1-m.y,_ioDrag.oh+(p.y-_ioDrag.sy)));}
    ioPaintMasks(); e.preventDefault();
  };
  const end=()=>{ if(!_ioDrag)return; const m=(editing._occMasks||[]).find(x=>x.id===_ioDrag.id);
    if(_ioDrag.mode==='draw'&&m&&(m.w<0.02||m.h<0.02))editing._occMasks=editing._occMasks.filter(x=>x.id!==_ioDrag.id);
    _ioDrag=null; ioRefresh(); };
  wrap.onpointerup=end; wrap.onpointercancel=end;
}

function greeting(){const h=new Date().getHours();return (h<5?'Still up?':h<12?'Good morning':h<18?'Good afternoon':'Good evening')+' — ready to recall?';}
function deckCardHTML(d,i){
  const c=deckCounts(d.id); const due=c.new+c.lrn+c.due; const done=due===0&&c.total>0;
  const Z=n=>n===0?' zero':'';
  const depth=deckDepth(d.name);
  const crumb=depth>0?`<div class="desc" style="color:var(--faint);font-size:10.5px;margin-bottom:2px;text-transform:uppercase;letter-spacing:.8px">${esc(deckParentPath(d.name))}</div>`:'';
  const title=depth>0?deckShortName(d.name):d.name;
  const hasKids=deckHasChildren(d.id);

  // ---- LEAF deck: tap = study (original behavior) ----
  if(!hasKids){
    return `<div class="deck${done?' done':''}" style="--dc:${d.color};animation-delay:${i*40}ms" onclick="startStudy('${d.id}','srs')">
      <div class="deck-top"><div style="min-width:0">
        <div class="deck-dot" style="margin-bottom:11px"><i></i></div>
        ${crumb}<h3>${esc(title)}</h3><div class="desc">${esc(d.desc||'')}</div>
      </div></div>
      <div class="deck-counts">
        <div class="dc-item dc-new${Z(c.new)}"><b>${c.new}</b><span>New</span></div>
        <div class="dc-item dc-lrn${Z(c.lrn)}"><b>${c.lrn}</b><span>Learn</span></div>
        <div class="dc-item dc-due${Z(c.due)}"><b>${c.due}</b><span>Due</span></div>
        <div class="deck-cta">${done?'Done '+ICON.check:'Study '+ICON.arrow}</div>
      </div>
      <div class="deck-mini"></div>
    </div>`;
  }

  // ---- PARENT deck: one card, tap to expand options ----
  const open=expandedDecks.has(d.id);
  const directKids=decksSortedTree().filter(x=>deckParentPath(x.name)===d.name);
  const subCount=directKids.length;
  let panel='';
  if(open){
    panel='<div class="subdeck-list" onclick="event.stopPropagation()">'+
      `<button class="btn btn-primary btn-sm sd-studyall" ${due?'':'disabled'} onclick="event.stopPropagation();startStudy('${d.id}','srs')">${ICON.bolt} Study all${due?' · '+due:' · caught up'}</button>`+
      directKids.map((k,ki)=>{
        const kc=deckCounts(k.id);
        const zc=(n,cls)=>`<span class="${n===0?'z':cls}">${n}</span>`;
        const grand=deckHasChildren(k.id);
        const isLast=ki===directKids.length-1;
        return `<div class="subdeck-row" style="--dc:${k.color}" onclick="event.stopPropagation();startStudy('${k.id}','srs')" title="Study ${esc(k.name)}${grand?' (incl. its sub-decks)':''}">

        </div>`;
      }).join('')+'</div>';
  }
  return `<div class="deck deck-parent${open?' open':''}${done?' done':''}" style="--dc:${d.color};animation-delay:${i*40}ms" onclick="toggleDeckExpand('${d.id}',event)">

    </div>
    ${panel}
    <div class="deck-mini"></div>
  </div>`;
}

let bFilter={deck:'all',state:'all',flag:'all',q:'',sort:'created',dir:-1}, bSel=new Set();
function renderBrowse(){
  $('#browse').innerHTML=`

    <select id="bdeck" onchange="bFilter.deck=this.value;renderBrowseTable()"><option value="all">All decks</option>${decksSortedTree().map(d=>`<option value="${d.id}" ${bFilter.deck===d.id?'selected':''}>${'\u2003'.repeat(deckDepth(d.name))}${esc(deckShortName(d.name))}</option>`).join('')}</select>
    <select onchange="bFilter.state=this.value;renderBrowseTable()">${['all','new','learning','review','relearning','suspended','due'].map(s=>`<option value="${s}" ${bFilter.state===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select>
    <select onchange="bFilter.flag=this.value;renderBrowseTable()"><option value="all">Any flag</option><option value="1">🔴 Red</option><option value="2">🟠 Orange</option><option value="3">🟢 Green</option><option value="4">🔵 Blue</option></select>
    <button class="btn btn-ghost btn-sm" onclick="newCard()">${ICON.plus} Add</button>
  </div>
  <div id="bulkBar"></div>
  <div id="browseTable"></div>`;
  renderBrowseTable();
}
function filteredCards(){
  let cs=state.cards.slice();
  if(bFilter.deck!=='all'){const ids=new Set(deckIdsUnder(bFilter.deck));cs=cs.filter(c=>ids.has(c.deckId));}
  if(bFilter.flag!=='all')cs=cs.filter(c=>c.flag==+bFilter.flag);
  if(bFilter.state!=='all'){
    if(bFilter.state==='suspended')cs=cs.filter(c=>c.suspended);
    else if(bFilter.state==='due')cs=cs.filter(c=>!c.suspended&&c.state!=='new'&&c.due<=endOfToday());
    else cs=cs.filter(c=>c.state===bFilter.state&&!c.suspended);
  }
  if(bFilter.q.trim()){const q=bFilter.q.toLowerCase();cs=cs.filter(c=>(stripHTML(c.front)+' '+stripHTML(c.back||'')+' '+(c.opts||[]).join(' ')+' '+(c.tags||[]).join(' ')).toLowerCase().includes(q));}
  const k=bFilter.sort, dir=bFilter.dir;
  cs.sort((a,b)=>{let x,y;if(k==='front'){x=stripHTML(a.front).toLowerCase();y=stripHTML(b.front).toLowerCase();return x<y?-dir:x>y?dir:0;}x=a[k]||0;y=b[k]||0;return (x-y)*dir;});
  return cs;
}
function setSort(k){if(bFilter.sort===k)bFilter.dir*=-1;else{bFilter.sort=k;bFilter.dir=1;}renderBrowseTable();}
function renderBrowseTable(){
  const cs=filteredCards();

/* ---------- SMART AUTO-FORMAT ----------
   Runs on every card save AND on import. Cleans up raw/imported text and adds
   visual emphasis so cards look polished in study. Uses class="sf" markers so
   formatting is idempotent (safe to re-apply) and stripped cleanly when editing. */
function sfStrip(t){return (t||'').replace(/<b class="sf"[^>]*>([\s\S]*?)<\/b>/g,'$1');}
function smartFormat(text){
  if(!text||!text.trim())return text;
  let t=sfStrip(text);
  // Protect cloze markers and existing non-sf HTML from being mangled
  const clozes=[],htmlTags=[];
  t=t.replace(/\{\{c\d+::[\s\S]*?(?:::[\s\S]*?)?\}\}/g,m=>{clozes.push(m);return '\x01C'+(clozes.length-1)+'\x01';});
  t=t.replace(/<[^>]+>/g,m=>{htmlTags.push(m);return '\x01T'+(htmlTags.length-1)+'\x01';});

  // ── 1) CLEAN UP: spacing, whitespace, punctuation ──
  t=t.replace(/\t/g,' ');                       // tabs → space
  t=t.replace(/ {2,}/g,' ');                     // collapse runs of spaces
  t=t.replace(/^\s+|\s+$/gm,'');                 // trim each line
  t=t.replace(/ +([.,;:!?)\]"])/g,'$1');         // no space before punctuation
  t=t.replace(/([.,;:!?])([A-Za-z\d([\x01])/g,'$1 $2'); // space after punctuation
  t=t.replace(/([–—])/g,' $1 ');                 // space around dashes
  t=t.replace(/ {2,}/g,' ').trim();              // re-collapse after dash fix
  if(/^[a-z]/.test(t))t=t[0].toUpperCase()+t.slice(1); // capitalize first char
  // Fix ALL-CAPS sentences (>60% uppercase → title-case the sentence)
  t=t.replace(/^([A-Z][A-Z\s.,;:!?]{15,})$/gm,m=>{
    if((m.match(/[A-Z]/g)||[]).length/m.replace(/\s/g,'').length>0.6)
      return m.charAt(0)+m.slice(1).toLowerCase();
    return m;
  });

  // ── 2) NUMBERS + MEDICAL UNITS → brand color ──
  t=t.replace(/\b(\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?)\s*(mg\/dL|mmol\/L|mEq\/L|g\/dL|mL\/min|mL\/kg|mL|mm³|mmHg|bpm|beats\/min|breaths\/min|IU\/L|U\/L|cells\/mm³|ng\/mL|pg\/mL|µg\/dL|µg\/L|µg|mcg|mg|mm|cm|m²|kg|g\/L|g|L\/min|L|%|°[CF]|kPa|diopters?|weeks?|days?|hours?|minutes?|min|sec|seconds?|mo(?:nths?)?|years?|yr)\b/gi,
    (m,n,u)=>'<b class="sf" style="color:var(--brand)">'+n.trim()+' '+u+'</b>');
  // Ranges like "> 140" or "≥ 90"
  t=t.replace(/([><≥≤])\s*(\d+(?:[.,]\d+)?)\s*(mg\/dL|mmol\/L|mEq\/L|mmHg|bpm|%|°[CF]|cells\/mm³|mL|mm|kg)\b/gi,
    (m,op,n,u)=>'<b class="sf" style="color:var(--brand)">'+op+' '+n+' '+u+'</b>');

  // ── 3) KEY STUDY PHRASES → green (--good) ──
  ['most common','most frequent','gold standard','first[- ]line','second[- ]line',
   'drug of choice','treatment of choice','investigation of choice',
   'most important','most likely','best initial','next best step',
   'most sensitive','most specific','pathognomonic','hallmark',
   'characteristic(?:\\s+finding)?','definitive(?:\\s+(?:diagnosis|treatment))?',
   'contraindicated','classic(?:\\s+(?:presentation|triad|finding|sign|feature))?',
   'red flag','life[- ]threatening','medical emergency',
   'always','never','only','must','immediately','urgently',
   'dx of exclusion','sine qua non','key feature','cardinal sign',
   'initial(?:\\s+(?:investigation|management|treatment|step))',
   'primary cause','secondary to','complication of',
   'risk factor','protective factor','poor prognosis','good prognosis',
   'presents with','associated with','leads to','results in',
   'triggered by','exacerbated by','relieved by','worsened by',
   'increases?','decreases?','elevated','reduced','absent','present']
  .forEach(p=>{t=t.replace(new RegExp('(?<![\\w\x01])\\b('+p+')\\b(?![\\w\x01])','gi'),
    '<b class="sf" style="color:var(--good)">$1</b>');});

  // ── 4) MEDICAL ABBREVIATIONS (2-6 uppercase) → bold ──
  t=t.replace(/(?<![<\/\w\x01])([A-Z]{2,6})(?![^<]*>)(?=[\s.,;:!?)"\x01]|$)/g,
    '<b class="sf">$1</b>');

  // ── 5) DASH-SEPARATED LISTS → cleaner bullets ──
  // Lines starting with "- " get a styled bullet
  t=t.replace(/(^|\n)- /g,'$1• ');

  // Restore protected tokens
  htmlTags.forEach((v,i)=>{t=t.replace('\x01T'+i+'\x01',v);});
  clozes.forEach((v,i)=>{t=t.replace('\x01C'+i+'\x01',v);});
  return t;
}

function saveCard(){
  if(editing.type==='occlusion')return saveOcclusion();
  editSync(); const e=editing;
  if(!stripHTML(e.front).trim()){toast('⚠️ Front cannot be empty');return;}
  if(e.type==='cloze'&&!/\{\{c\d+::/.test(e.front)){toast('⚠️ Add at least one cloze {{c1::…}}');return;}
  if(e.type==='mcq'&&e.opts.filter(o=>o.trim()).length<2){toast('⚠️ Need at least 2 options');return;}
  // Smart auto-format: clean spacing, highlight values & key phrases
  const fmtFront=smartFormat(e.front);
  const fmtBack=smartFormat(e.back||'');
  const fmtOpts=e.type==='mcq'?e.opts.filter(o=>o.trim()).map(o=>smartFormat(o)):null;
  const fmtExtra=e._extraRaw&&e._extraRaw.trim()?'<div class="aexp">'+smartFormat(esc(e._extraRaw.trim()))+'</div>':(e.type==='mcq'?'':e.extra||'');
  if(e._id){
    const c=state.cards.find(x=>x.id===e._id);
    Object.assign(c,{type:e.type,front:fmtFront,back:fmtBack,extra:e.type==='mcq'&&e._extraRaw?('<div class="aexp">'+smartFormat(esc(e._extraRaw))+'</div>'):fmtExtra,opts:fmtOpts,answer:Math.min(e.answer,(e.opts.filter(o=>o.trim()).length||1)-1),deckId:e.deckId,tags:e.tags});
    save();toast('✓ Saved');go(editReturn);
  }else{
    const card={id:uid(),deckId:e.deckId,type:e.type,front:fmtFront,back:fmtBack,extra:e.type==='mcq'&&e._extraRaw?('<div class="aexp">'+smartFormat(esc(e._extraRaw))+'</div>'):fmtExtra,opts:fmtOpts,answer:Math.min(e.answer,(e.opts.filter(o=>o.trim()).length||1)-1),tags:e.tags,state:'new',interval:0,ease:state.cfg.startEase,reps:0,lapses:0,stepIndex:0,due:Date.now(),created:Date.now(),flag:0,suspended:false,buriedUntil:0,lastReviewed:0,history:[]};
    state.cards.push(card);save();toast('✓ Card added — auto-formatted');
    editing={_id:null,type:e.type,deckId:e.deckId,front:'',back:'',extra:'',_extraRaw:'',opts:['','','',''],answer:0,tags:e.tags};renderEditor();
  }
}
function deleteCard(){if(isReadonly())return;
  if(editing.type==='occlusion'&&editing._occGroupId){
    const gid=editing._occGroupId;const sib=state.cards.filter(c=>c.type==='occlusion'&&c.groupId===gid);
    if(!confirm('Delete this image and all '+sib.length+' of its card'+(sib.length>1?'s':'')+'?'))return;
    state.cards=state.cards.filter(c=>!(c.type==='occlusion'&&c.groupId===gid));gcImages();save();toast('Image occlusion deleted');go(editReturn);return;
  }

function retention(days){const since=Date.now()-days*DAY;const r=state.rev.filter(x=>x.rev&&x.t>=since);if(!r.length)return null;return Math.round(r.filter(x=>x.r>1).length/r.length*100);}
function streakCount(){const has=k=>{const x=state.daily[k];return x&&(dayTotal(x)>0||x.new>0||x.rev>0);};let n=0;const d=new Date();d.setHours(0,0,0,0);if(!has(dateKey(d.getTime())))d.setDate(d.getDate()-1);while(has(dateKey(d.getTime()))){n++;d.setDate(d.getDate()-1);}return n;}
function heatHTML(days){
  const cells=[]; const today=startOfToday();
  const start=today-(days-1)*DAY; const sd=new Date(start); const pad=sd.getDay();
  for(let i=0;i<pad;i++)cells.push('<div class="cell" style="visibility:hidden"></div>');
  for(let i=0;i<days;i++){const ts=start+i*DAY;const k=dateKey(ts);const n=dayTotal(state.daily[k]);const lvl=n===0?0:n<5?1:n<10?2:n<20?3:4;cells.push(`<div class="cell" style="background:var(--heat-${lvl})" title="${n} review${n!==1?'s':''} · ${new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}"></div>`);}
  return `<div class="heat">${cells.join('')}</div>`;
}
function renderStats(){

  const mYoung=state.cards.filter(c=>!c.suspended&&c.state==='review'&&c.interval<21).length;
  const mMature=state.cards.filter(c=>!c.suspended&&c.state==='review'&&c.interval>=21).length;
  const act=mNew+mLearn+mYoung+mMature||1;
  const seg=[['New','var(--easy)',mNew],['Learning','var(--again)',mLearn],['Young','var(--hard)',mYoung],['Mature','var(--good)',mMature]];
  let acc=0; const stops=seg.map(([n,col,v])=>{const a=acc/act*360;acc+=v;const b=acc/act*360;return `${col} ${a}deg ${b}deg`;}).join(',');
  const totalRev=state.rev.length; const ret30=retention(30), ret7=retention(7);
  const studiedToday=dayTotal(state.daily[todayKey()]); const timeToday=(state.daily[todayKey()]||{}).ms||0;
  // forecast 30d
  const fc=Array(30).fill(0); state.cards.filter(c=>!c.suspended&&c.state==='review').forEach(c=>{let off=Math.floor((c.due-startOfToday())/DAY);if(off<0)off=0;if(off<30)fc[off]++;});
  const fcMax=Math.max(1,...fc);
  // reviews per day 14
  const rpd=[]; for(let i=13;i>=0;i--){const ts=startOfToday()-i*DAY;rpd.push({k:ts,n:dayTotal(state.daily[dateKey(ts)])});}

  $('#stats').innerHTML=`

  <div class="stat-grid">

    <div class="stat-card"><div class="ic">${ICON.check}</div><div class="sv">${studiedToday}</div><div class="sl">Reviewed today</div><div class="sub">${fmtTime(timeToday)} studied</div></div>
    <div class="stat-card"><div class="ic">${ICON.target}</div><div class="sv" style="color:var(--good)">${ret30==null?'—':ret30+'%'}</div><div class="sl">Retention 30d</div><div class="sub">7d: ${ret7==null?'—':ret7+'%'}</div></div>
    <div class="stat-card"><div class="ic">${ICON.layers}</div><div class="sv">${total}</div><div class="sl">Total cards</div><div class="sub">${susp} suspended</div></div>
  </div>
  <div class="panel"><h3>Review heatmap</h3><div class="ph-sub">Last 17 weeks of activity</div>${heatHTML(119)}<div class="heat-legend">Less ${[0,1,2,3,4].map(l=>`<i style="background:var(--heat-${l})"></i>`).join('')} More</div></div>
  <div class="panel"><h3>Card maturity</h3><div class="ph-sub">Distribution of ${act} active cards</div>

      <div class="legend">${seg.map(([n,col,v])=>`<div class="li"><i style="background:${col}"></i>${n}<b>${v}</b></div>`).join('')}</div></div></div>
  <div class="panel"><h3>Due forecast</h3><div class="ph-sub">Review cards coming due over the next 30 days</div>
    <div class="bars">${fc.map((v,i)=>`<div class="bar-col"><div class="bar ${v?'':'empty'}" style="height:${v/fcMax*100}%"></div><div class="blabel">${i===0?'今':i%5===0?'+'+i:''}</div></div>`).join('')}</div></div>

save();renderSettings();toast(kids.length?('Renamed (and '+kids.length+' sub-deck'+(kids.length>1?'s':'')+')'):'Renamed');}
function deleteDeck(id){if(isReadonly())return;const ids=deckIdsUnder(id);const idset=new Set(ids);const n=state.cards.filter(c=>idset.has(c.deckId)).length;const subN=ids.length-1;if(state.decks.length-ids.length<1){toast('Keep at least one deck');return;}if(!confirm('Delete this deck'+(subN?' and its '+subN+' sub-deck'+(subN>1?'s':''):'')+(n?' and '+n+' card'+(n>1?'s':''):'')+'? This cannot be undone.'))return;state.cards=state.cards.filter(c=>!idset.has(c.deckId));state.decks=state.decks.filter(d=>!idset.has(d.id));save();renderSettings();toast('Deleted');}
/* ============================================================
   CARD IMPORT — Anki text / CSV / TSV / pasted text
   Supports Anki file headers: #separator, #html, #deck column,
   #tags column, #notetype column, #guid column, #columns.
   Quoted fields (RFC-4180) may span multiple lines.
   ============================================================ */
const SEP_NAMES={tab:'\t',comma:',',semicolon:';',pipe:'|',colon:':',space:' '};
const SEP_LABEL={'\t':'Tab',',':'Comma',';':'Semicolon','|':'Pipe',':':'Colon',' ':'Space'};

function detectSeparator(lines){
  const cand=['\t',',',';','|'];
  let best='\t',bestScore=-1;
  cand.forEach(sep=>{
    const counts=lines.slice(0,25).map(l=>splitDelimited(l,sep).length-1).filter(n=>n>0);
    if(!counts.length)return;
    const avg=counts.reduce((a,b)=>a+b,0)/counts.length;
    const consistent=counts.every(n=>n===counts[0])?1.5:1;
    const score=avg*consistent*(sep==='\t'?1.2:1); // bias to tab (Anki default)
    if(score>bestScore){bestScore=score;best=sep;}
  });
  return best;
}

/* Split one already-isolated record into fields (quotes already balanced). */
function splitDelimited(line,sep){
  const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=ch;
    }else{
      if(ch==='"'&&cur==='')inQ=true;
      else if(ch===sep){out.push(cur);cur='';}
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}

/* Split full text into records, letting quoted fields span newlines. */
function splitRecords(text,sep){
  const recs=[];let cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){inQ=!inQ;cur+=ch;}
    else if(ch==='\n'&&!inQ){recs.push(cur);cur='';}
    else cur+=ch;
  }
  if(cur.trim()!=='')recs.push(cur);
  return recs;
}

function parseCardText(text){
  text=String(text||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const meta={sep:null,html:true,deckCol:0,tagsCol:0,typeCol:0,guidCol:0,columns:null,headerLines:0};
  const rawLines=text.split('\n');
  let bodyStart=0;
  for(const l of rawLines){
    const m=l.match(/^#\s*([a-z ]+?)\s*:\s*(.+)\s*$/i);
    if(!m)break;
    bodyStart++; meta.headerLines++;
    const key=m[1].toLowerCase().trim(), val=m[2].trim();
    if(key==='separator')meta.sep=SEP_NAMES[val.toLowerCase()]||(val.length===1?val:null);
    else if(key==='html')meta.html=/^true$/i.test(val);
    else if(key==='deck column')meta.deckCol=+val||0;
    else if(key==='tags column')meta.tagsCol=+val||0;
    else if(key==='notetype column')meta.typeCol=+val||0;
    else if(key==='guid column')meta.guidCol=+val||0;
    else if(key==='columns')meta.columns=val.split(/[\t,;|]/).map(s=>s.trim().toLowerCase());
  }
  const body=rawLines.slice(bodyStart).join('\n');
  const probe=body.split('\n').filter(l=>l.trim()&&!l.startsWith('#'));
  if(!meta.sep)meta.sep=detectSeparator(probe);
  // #columns header can also define deck/tags positions
  if(meta.columns){
    meta.columns.forEach((c,i)=>{
      if(/^deck/.test(c)&&!meta.deckCol)meta.deckCol=i+1;
      if(/^tag/.test(c)&&!meta.tagsCol)meta.tagsCol=i+1;
      if(/note ?type/.test(c)&&!meta.typeCol)meta.typeCol=i+1;
      if(/guid/.test(c)&&!meta.guidCol)meta.guidCol=i+1;
    });
  }
  const records=splitRecords(body,meta.sep).filter(r=>r.trim()&&!r.trimStart().startsWith('#'));
  const cards=[],decks=new Set();let skipped=0;
  // Field indexes: front/back = first two columns that aren't deck/tags/type/guid
  const special=new Set([meta.deckCol,meta.tagsCol,meta.typeCol,meta.guidCol].filter(Boolean).map(n=>n-1));
  records.forEach(rec=>{
    const f=splitDelimited(rec,meta.sep).map(x=>x.trim());
    const content=f.filter((_,i)=>!special.has(i));
    let front=content[0]||'',back=content[1]||'',extraCol=content[2]||'';
    if(!front){skipped++;return;}
    const deckName=meta.deckCol?(f[meta.deckCol-1]||'').trim():'';
    const tags=meta.tagsCol?(f[meta.tagsCol-1]||'').split(/[\s,]+/).map(t=>t.trim()).filter(Boolean):[];
    const noteType=meta.typeCol?(f[meta.typeCol-1]||'').toLowerCase():'';
    const fix=s=>meta.html?s.replace(/\n/g,'<br>'):esc(s).replace(/\n/g,'<br>');
    front=fix(front);back=fix(back);
    const isCloze=/cloze/.test(noteType)||/\{\{c\d+::/.test(front);
    const card=isCloze
      ?{type:'cloze',front,back:'',opts:null,answer:0}
      :{type:'basic',front,back,opts:null,answer:0};
    if(extraCol)card.extra='<div class="aexp">'+fix(extraCol)+'</div>';
    card.tags=tags;card.deckName=deckName;
    if(deckName)decks.add(deckName);
    cards.push(card);
  });
  return {cards,decks:[...decks],meta,skipped};
}

const DECK_PALETTE=['#8b9eff','#7be0d6','#ff9ec9','#9ece6a','#f7768e','#74c7ec','#e0af68','#cba6f7','#ff9e64','#a6e3a1'];
function ensureDeckByName(name){
  // Ensure every ancestor exists too, so "Pediatrics::Cardiology" always has a
  // real "Pediatrics" parent to group under (no orphan sub-decks on the home grid).
  const parts=String(name).split(DECK_SEP).map(s=>s.trim()).filter(Boolean);
  let path='', last=null;
  for(let i=0;i<parts.length;i++){
    path = i===0 ? parts[0] : path+DECK_SEP+parts[i];
    let d=state.decks.find(x=>x.name.toLowerCase()===path.toLowerCase());
    if(!d){d={id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:path,color:DECK_PALETTE[state.decks.length%DECK_PALETTE.length],desc:''};state.decks.push(d);}
    last=d;
  }
  return last;
}
/* One-time normalization: synthesize any missing ancestor decks for existing data
   (e.g. an imported "A::B" with no "A" deck). Safe to run repeatedly. */
function ensureDeckAncestors(){
  let added=0;
  state.decks.slice().forEach(d=>{
    const parts=d.name.split(DECK_SEP);
    let path='';
    for(let i=0;i<parts.length-1;i++){
      path = i===0 ? parts[0] : path+DECK_SEP+parts[i];
      if(!state.decks.some(x=>x.name.toLowerCase()===path.toLowerCase())){
        state.decks.push({id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:path,color:d.color,desc:''});
        added++;
      }
    }
  });
  return added;
}
const normKey=s=>stripHTML(String(s)).toLowerCase().replace(/\s+/g,' ').trim();

/* ---------- JSON import (Recall export or a bare card array) ---------- */
function parseCardsJSON(text){
  let data; try{data=JSON.parse(text);}catch(e){return {cards:[],decks:[],meta:{},skipped:0,_err:'Invalid JSON file'};}
  const root=data&&data.recall_export?data.state:data;
  let src=[],deckMap={};
  if(Array.isArray(root))src=root;
  else if(root&&Array.isArray(root.cards)){src=root.cards;(root.decks||[]).forEach(d=>{deckMap[d.id]=d.name;});}
  else return {cards:[],decks:[],meta:{},skipped:0,_err:'No "cards" array found in JSON'};
  const cards=[],decks=new Set();let skipped=0;
  src.forEach(c=>{
    const front=String(c.front||c.q||c.question||'').trim();
    if(!front){skipped++;return;}
    const isCloze=c.type==='cloze'||/\{\{c\d+::/.test(front);
    const isMcq=c.type==='mcq'||(Array.isArray(c.opts)&&c.opts.length);
    const type=isCloze?'cloze':isMcq?'mcq':'basic';
    const deckName=c.deckName||c.deck||deckMap[c.deckId]||'';
    const card={type,front,back:type==='cloze'?'':String(c.back||c.a||c.answer||''),opts:Array.isArray(c.opts)?c.opts:null,answer:+c.answer||0,extra:c.extra||'',tags:Array.isArray(c.tags)?c.tags.filter(t=>t!=='by_Yanal'):[],deckName};
    if(deckName)decks.add(deckName);
    cards.push(card);
  });
  return {cards,decks:[...decks],meta:{sourceLabel:'from JSON',deckCol:decks.size?1:0,html:true},skipped};
}

/* ---------- .apkg import (pure-JS ZIP + SQLite reader, no libraries) ----------
   An .apkg is a ZIP whose collection.anki2 is a SQLite database. We unzip with
   the browser's DecompressionStream, then read the notes/cards/col tables
   directly. Media is skipped; Anki "::" deck names map onto our sub-decks. */
async function inflateRaw(u8){
  if(typeof DecompressionStream==='undefined')throw new Error('Your browser can’t unzip .apkg — use a recent Chrome, or import the .txt export.');
  const ds=new DecompressionStream('deflate-raw');
  const stream=new Response(new Blob([u8])).body.pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function zipEntries(buf){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  // find End Of Central Directory (signature 0x06054b50), scanning backwards
  let eocd=-1;
  for(let i=buf.length-22;i>=0&&i>buf.length-22-65536;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('Not a valid .apkg (no ZIP directory)');
  const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  const out={}; let p=cdOff;
  for(let n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), cmtLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nameLen));
    out[name]={method,compSize,lho};
    p+=46+nameLen+extraLen+cmtLen;
  }
  return {buf,dv,out};
}
async function zipRead(z,name){
  const e=z.out[name]; if(!e)return null;
  const dv=z.dv, lho=e.lho;
  if(dv.getUint32(lho,true)!==0x04034b50)throw new Error('Corrupt ZIP entry');
  const nameLen=dv.getUint16(lho+26,true), extraLen=dv.getUint16(lho+28,true);
  const start=lho+30+nameLen+extraLen;
  const comp=z.buf.subarray(start,start+e.compSize);
  if(e.method===0)return comp.slice();           // stored
  if(e.method===8)return await inflateRaw(comp);  // deflate
  throw new Error('Unsupported ZIP compression in .apkg');
}
function sqliteReader(bytes){
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  if(new TextDecoder().decode(bytes.subarray(0,15))!=='SQLite format 3')throw new Error('Not a SQLite database (modern .anki21b/zstd isn’t supported — in Anki choose “Legacy .apkg” export, or use .txt).');
  let pageSize=dv.getUint16(16); if(pageSize===1)pageSize=65536;
  const reserved=dv.getUint8(20);
  const U=pageSize-reserved;
  function varint(arr,off){let r=0n,i=0;for(;i<8;i++){const b=arr[off+i];r=(r<<7n)|BigInt(b&0x7f);if(!(b&0x80))return[r,i+1];}r=(r<<8n)|BigInt(arr[off+8]);return[r,9];}
  function pageStart(pg){return (pg-1)*pageSize;}
  function readCellPayload(off){
    const [plen,a]=varint(bytes,off); const [rowid,b]=varint(bytes,off+a); // table leaf cell
    const P=Number(plen); let h=off+a+b;
    const X=U-35;
    let local; if(P<=X)local=P; else{const M=Math.floor(((U-12)*32)/255)-23; const k=M+((P-M)%(U-4)); local=(k<=X)?k:M;}
    let payload=new Uint8Array(P); payload.set(bytes.subarray(h,h+local),0);
    let filled=local;
    if(P>local){
      let nextPg=dv.getUint32(h+local);
      while(nextPg&&filled<P){
        const ps=pageStart(nextPg); const np=dv.getUint32(ps); const chunk=Math.min(U-4,P-filled);
        payload.set(bytes.subarray(ps+4,ps+4+chunk),filled); filled+=chunk; nextPg=np;
      }
    }
    return {rowid,payload};
  }
  function parseRecord(payload){
    const [hlen,a]=varint(payload,0); let p=a; const types=[]; const H=Number(hlen);
    while(p<H){const [t,n]=varint(payload,p);types.push(Number(t));p+=n;}
    let d=H; const vals=[];
    const rd=(st)=>{
      if(st===0)return null; if(st>=1&&st<=4){let v=0;for(let i=0;i<st;i++)v=(v<<8)|payload[d+i];if(st<4&&(v&(0x80<<(8*(st-1)))))v-=1<<(8*st);d+=st;return v;}
      if(st===5){let v=0;for(let i=0;i<6;i++)v=v*256+payload[d+i];d+=6;return v;}
      if(st===6){let v=0n;for(let i=0;i<8;i++)v=(v<<8n)|BigInt(payload[d+i]);d+=8;return Number(BigInt.asIntN(64,v));}
      if(st===7){const dvv=new DataView(payload.buffer,payload.byteOffset+d,8);d+=8;return dvv.getFloat64(0);}
      if(st===8)return 0; if(st===9)return 1;
      if(st>=12){const len=Math.floor((st-(st%2?13:12))/2);const slice=payload.subarray(d,d+len);d+=len;return st%2?new TextDecoder().decode(slice):slice;}
      return null;
    };
    for(const t of types)vals.push(rd(t));
    return vals;
  }
  function walk(pg,rows){
    const base=pageStart(pg); const o=(pg===1)?100:0; const type=bytes[base+o];
    const nCells=dv.getUint16(base+o+3);
    const cellPtrBase=base+o+(type===0x05?12:8);
    if(type===0x0d){ // leaf table
      for(let i=0;i<nCells;i++){const cp=dv.getUint16(cellPtrBase+i*2);const {rowid,payload}=readCellPayload(base+cp);rows.push({rowid,vals:parseRecord(payload)});}
    }else if(type===0x05){ // interior table
      for(let i=0;i<nCells;i++){const cp=dv.getUint16(cellPtrBase+i*2);const child=dv.getUint32(base+cp);walk(child,rows);}
      const right=dv.getUint32(base+o+8);walk(right,rows);
    }
    return rows;
  }
  // sqlite_master is the table b-tree rooted at page 1
  const master=walk(1,[]);
  const roots={};
  master.forEach(r=>{const [t,name,, rootpage]=r.vals; if(t==='table')roots[name]=rootpage;});
  const readTable=name=>roots[name]?walk(roots[name],[]).map(r=>{if(r.vals[0]==null)r.vals[0]=Number(r.rowid);return r.vals;}):[];
  return {readTable};
}
async function parseApkgBuffer(u8){
  const z=await zipEntries(u8);
  // prefer the legacy SQLite collection; modern zstd (.anki21b) is not supported
  const colName=z.out['collection.anki2']?'collection.anki2':(z.out['collection.anki21']?'collection.anki21':null);
  if(!colName)throw new Error('No readable collection in this .apkg (modern zstd export). In Anki, export with “Support older Anki versions”, or use the .txt export.');
  const dbBytes=await zipRead(z,colName);
  const db=sqliteReader(dbBytes);
  const col=db.readTable('col')[0]||[];
  let decksJson={},modelsJson={};
  try{decksJson=JSON.parse(col[10]||'{}');}catch(_){}
  try{modelsJson=JSON.parse(col[9]||'{}');}catch(_){}
  const deckName=did=>{const d=decksJson[did]||decksJson[String(did)];return d&&d.name?d.name.replace(/\x1f/g,DECK_SEP):'';};
  // map note id -> deck id (first card wins)
  const noteDeck={};
  db.readTable('cards').forEach(c=>{const nid=c[1],did=c[2];if(noteDeck[nid]==null)noteDeck[nid]=did;});
  const cards=[],decks=new Set();let skipped=0;
  db.readTable('notes').forEach(n=>{
    const id=n[0], mid=n[2], tagsStr=String(n[5]||''), flds=String(n[6]||'');
    const fields=flds.split('\x1f');
    const model=modelsJson[mid]||modelsJson[String(mid)]||{};
    const isCloze=model.type===1||/\{\{c\d+::/.test(fields[0]||'');
    const front=(fields[0]||'').trim(); if(!front){skipped++;return;}
    const tags=tagsStr.split(/\s+/).map(t=>t.trim()).filter(Boolean);
    const dname=deckName(noteDeck[id]);
    const card=isCloze
      ?{type:'cloze',front,back:'',opts:null,answer:0,extra:(fields[1]?'<div class="aexp">'+fields[1]+'</div>':''),tags,deckName:dname}
      :{type:'basic',front,back:(fields[1]||''),opts:null,answer:0,extra:(fields[2]?'<div class="aexp">'+fields[2]+'</div>':''),tags,deckName:dname};
    if(dname)decks.add(dname);
    cards.push(card);
  });
  if(!cards.length)throw new Error('No cards found in this .apkg.');
  return {cards,decks:[...decks],meta:{sourceLabel:'from Anki .apkg',deckCol:decks.size?1:0,html:true},skipped};
}

function commitCardImport(parsed,opts){
  const existing=new Set(state.cards.map(c=>normKey(c.front)+'¦'+c.deckId));
  let added=0,dupes=0;const now=Date.now();
  parsed.cards.forEach((pc,i)=>{
    const deck=(opts.forceDeck||!pc.deckName)?deckById(opts.deckId):ensureDeckByName(pc.deckName);
    const key=normKey(pc.front)+'¦'+deck.id;
    if(opts.dedupe&&existing.has(key)){dupes++;return;}
    existing.add(key);
    state.cards.push({
      id:uid(),deckId:deck.id,type:pc.type,
      front:smartFormat(pc.front),back:smartFormat(pc.back||''),
      opts:Array.isArray(pc.opts)?pc.opts.map(o=>smartFormat(o)):pc.opts,
      answer:pc.answer,extra:pc.extra?smartFormat(pc.extra):'',
      tags:[...new Set([...(pc.tags||[]),'by_Yanal'])],
      state:'new',interval:0,ease:state.cfg.startEase,S:0,D:0,reps:0,lapses:0,stepIndex:0,
      due:now+i,created:now+i,flag:0,suspended:false,buriedUntil:0,lastReviewed:0,history:[]
    });
    added++;
  });
  ensureDeckAncestors(); // group any A::B decks created during import under a synthesized A
  save();
  return {added,dupes};
}

function impReadFile(f){
  const name=(f.name||'').toLowerCase();
  if(name.endsWith('.apkg')||name.endsWith('.colpkg')){
    $('#impDrop').innerHTML='⏳ Reading Anki package…';
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const parsed=await parseApkgBuffer(new Uint8Array(r.result));
        _imp.text=''; _imp.parsed=parsed;
        $('#impDrop').innerHTML='✅ <b>'+esc(f.name)+'</b> — '+parsed.cards.length+' cards found';
        impRenderPreview();
      }catch(e){_imp.parsed=null;impRenderPreview();$('#impDrop').innerHTML='⚠ '+esc(e.message||'Could not read .apkg');}
    };
    r.readAsArrayBuffer(f);
    return;
  }
  const r=new FileReader();
  r.onload=()=>{
    const parsed=name.endsWith('.json')?parseCardsJSON(r.result):parseCardText(r.result);
    _imp.text=name.endsWith('.json')?'':r.result;
    _imp.parsed=(parsed&&parsed.cards&&parsed.cards.length)?parsed:(parsed&&parsed._err?parsed:(r.result.trim()?parseCardText(r.result):null));
    if(parsed&&parsed._err&&!parsed.cards.length){$('#impDrop').innerHTML='⚠ '+esc(parsed._err);}
    else $('#impDrop').innerHTML='✅ <b>'+esc(f.name)+'</b> loaded — preview below';
    impRenderPreview();
  };

}

/* ---------- per-deck Anki TSV export (round-trips with AnkiDroid) ---------- */
function exportDeckTSV(deckId){
  if(isReadonly())return toast('Study edition — export is disabled.');
  const d=deckById(deckId);if(!d)return;
  const ids=new Set(deckIdsUnder(deckId));
  const allCards=state.cards.filter(c=>ids.has(c.deckId));
  const skipped=allCards.filter(c=>c.type==='occlusion').length;
  const cards=allCards.filter(c=>c.type!=='occlusion');
  if(!cards.length){toast(skipped?'Only image-occlusion cards here — use Export backup (JSON) to keep images':'This deck has no cards');return;}
  const clean=s=>String(s||'').replace(/\t/g,'  ').replace(/\r?\n/g,'<br>');
  const lines=['#separator:tab','#html:true','#deck column:3','#tags column:4','#notetype column:5'];
  cards.forEach(c=>{
    const cd=deckById(c.deckId)||d;
    let front=c.front,back=c.back,nt='Basic';
    if(c.type==='cloze'){nt='Cloze';back=c.extra?stripHTML(c.extra):'';}
    else if(c.type==='mcq'){
      front=c.front+'<br><br>'+c.opts.map((o,i)=>'ABCDEF'[i]+') '+o).join('<br>');
      back='<b>'+('ABCDEF'[c.answer])+') '+c.opts[c.answer]+'</b>'+(c.extra?'<br>'+stripHTML(c.extra):'');
    }else if(c.extra){back+= '<br><i>'+stripHTML(c.extra)+'</i>';}
    const tags=[...new Set([...(c.tags||[]),'by_Yanal'])].join(' ');
    lines.push([clean(front),clean(back),cd.name,tags,nt].join('\t'));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=deckShortName(d.name).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'_by_Yanal.txt';
  a.click();
  toast('Anki file exported · '+cards.length+' cards'+(skipped?' · '+skipped+' image card'+(skipped>1?'s':'')+' skipped (use JSON backup)':''));
}

function mergeImport(importedState){
  const localMap=new Map(state.cards.map(c=>[c.id,c]));
  let added=0,updated=0,skipped=0;
  importedState.cards.forEach(ic=>{
    // Smart-format every incoming card
    if(ic.front)ic.front=smartFormat(ic.front);
    if(ic.back)ic.back=smartFormat(ic.back);
    if(ic.extra)ic.extra=smartFormat(ic.extra);
    if(Array.isArray(ic.opts))ic.opts=ic.opts.map(o=>smartFormat(o));
    const lc=localMap.get(ic.id);
    if(!lc){state.cards.push(ic);added++;}
    else{
      const iNewer=(ic.lastReviewed||ic.created||0)>(lc.lastReviewed||lc.created||0);
      if(iNewer){Object.assign(lc,ic);updated++;}
      else skipped++;
    }
  });
  // Merge decks (add any new ones from import)
  const localDeckIds=new Set(state.decks.map(d=>d.id));
  importedState.decks.forEach(d=>{if(!localDeckIds.has(d.id))state.decks.push(d);});
  // Merge daily stats (keep local; fill in missing days from import)
  Object.keys(importedState.daily||{}).forEach(k=>{if(!state.daily[k])state.daily[k]=importedState.daily[k];});
  // Merge images (image-occlusion assets): add any the backup has that we don't
  state.images=state.images||{};
  Object.keys(importedState.images||{}).forEach(k=>{if(!state.images[k])state.images[k]=importedState.images[k];});
  save(); go('home');
  toast('Merged: +'+added+' new, '+updated+' updated, '+skipped+' unchanged');
}

function generateSyntheticDeck(count){
  count=count||1000;
  const id='d_synth_'+Date.now().toString(36);
  state.decks.push({id,name:'Synthetic Test ('+count+')',color:'#a0a0a0',desc:'Auto-generated for performance testing'});
  const topics=['Cardiology','Pulmonology','Neurology','Gastroenterology','Nephrology','Endocrinology','Hematology','Infectious Disease','Rheumatology','Dermatology'];
  const types=['basic','cloze','mcq'];
  const now=Date.now();
  for(let i=0;i<count;i++){
    const tp=types[i%3],topic=topics[i%topics.length];
    let extra={};
    if(tp==='basic'){extra={type:'basic',front:'[Synth '+i+'] In '+topic+': what is the mechanism of finding X?',back:'[Synth '+i+'] Finding X arises from pathway Y in '+topic+'.',opts:null,answer:0};}
    else if(tp==='cloze'){extra={type:'cloze',front:'[Synth '+i+'] In '+topic+', {{c1::finding X}} is the hallmark finding.',back:'',opts:null,answer:0};}
    else{extra={type:'mcq',front:'[Synth '+i+'] In '+topic+', which is most correct?',back:'',extra:'',opts:['Option A','Option B','Option C','Option D'],answer:i%4};}
    state.cards.push(Object.assign({id:uid(),deckId:id,tags:[topic,'synthetic'],state:'new',interval:0,ease:state.cfg.startEase,reps:0,lapses:0,stepIndex:0,due:now+i,created:now+i,flag:0,suspended:false,buriedUntil:0,lastReviewed:0,history:[]},extra));
  }
  save(); go('home'); toast('Generated '+count+' synthetic cards');
}

/* ---------- auto-backup browser & restore ---------- */
function getBackupSlots(){
  const last=+(safeGet(BAK_IDX_KEY)||0);
  const slots=[];
  for(let i=0;i<BAK_SLOTS;i++){
    const idx=(last-i+BAK_SLOTS)%BAK_SLOTS;
    const raw=safeGet(BAK_KEY+idx);
    if(!raw)continue;
    const s=tryParse(raw);
    if(!s||!s.cards)continue;
    slots.push({idx,age:i,ts:s._bakAt||0,cards:s.cards.length,sizeKB:Math.round(raw.length/1024)});
  }
  return slots;
}

function showAutoBackups(){
  const slots=getBackupSlots();
  if(!slots.length){toast('No auto-backups found yet');return;}
  const bg=document.createElement('div');
  bg.className='modal-bg on';
  const rows=slots.map(s=>{
    const ago=s.ts?(fmtAgo(s.ts)):'unknown time';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft)">
      <div><b style="font-size:13.5px">${s.cards} cards</b> <span style="color:var(--muted);font-size:12px">· ${s.sizeKB}KB · ${ago}</span></div>
      <button class="btn btn-ghost btn-sm" onclick="restoreBackupSlot(${s.idx},this.closest('.modal-bg'))">Restore</button>
    </div>`;
  }).join('');
  bg.innerHTML=`<div class="modal"><h3>${ICON.layers} Auto-backups</h3>
    <p style="color:var(--muted);font-size:12.5px;margin-bottom:14px">Up to ${BAK_SLOTS} checkpoints, one per 10-minute session block.</p>
    ${rows}
    <button class="btn btn-ghost btn-sm" style="margin-top:16px;width:100%" onclick="this.closest('.modal-bg').remove()">Close</button>
  </div>`;
  document.body.appendChild(bg);
}

function restoreBackupSlot(idx,modalEl){
  if(!confirm('Restore this backup? Your current data will be overwritten.'))return;
  const raw=safeGet(BAK_KEY+idx);
  const s=tryParse(raw);
  if(!s||!s.cards){toast('Backup slot is empty or corrupted');return;}
  try{
    state=migrate(s); state.cfg={...state_defaults,...state.cfg};
    document.body.dataset.theme=state.theme||'midnight';
    delete state._bakAt; save();
    if(modalEl)modalEl.remove();
    go('home'); toast('Backup restored successfully');
  }catch(e){toast('Could not restore this backup');}
}

function fmtAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return s+'s ago';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}

function fireConfetti(){const cv=$('#confetti');cv.style.display='block';const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#8b9eff','#c4a7ff','#7be0d6','#ff9ec9','#ffb454','#56d4a0'];const P=[];for(let i=0;i<140;i++)P.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-15-4,r:Math.random()*7+3,c:cols[i%cols.length],a:1,rot:Math.random()*6,vr:(Math.random()-.5)*.4});let t=0;function fr(){ctx.clearRect(0,0,cv.width,cv.height);t++;P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.a=Math.max(0,1-t/90);ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});if(t<95)requestAnimationFrame(fr);else cv.style.display='none';}fr();}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if($('#kbdModal').classList.contains('on')&&e.key==='Escape')return closeKbd();
  if(curScreen==='study'&&current){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();return;}
    if(flipped&&session.mode!=='cram'&&['1','2','3','4'].includes(e.key)){grade(+e.key);return;}
    if(e.key.toLowerCase()==='u'){undo();return;}
    if(e.key.toLowerCase()==='e'){editCurrent();return;}
    if(e.key.toLowerCase()==='r'){speakSide(flipped?'back':'front');return;}
    if(e.key.toLowerCase()==='f'){setFlag(current.flag===1?0:1);return;}
    if(e.key==='@'||(e.shiftKey&&e.key==='2')){suspendCurrent();return;}
    if(e.key==='Escape'){endSession();return;}
  }
  if(curScreen!=='study'){
    if(e.key==='?'){showKbd();return;}
    if(e.key.toLowerCase()==='d')go('home');
    else if(e.key.toLowerCase()==='b')go('browse');
    else if(e.key.toLowerCase()==='s')go('stats');
    else if(e.key.toLowerCase()==='t')cycleTheme();
    else if(e.key.toLowerCase()==='a')newCard();
  }
});

/* ---------- multi-tab safety ----------
   localStorage is shared across tabs; without a guard, two open tabs can
   silently overwrite each other. We resync when safe and warn during study. */
window.addEventListener('storage',e=>{
  if(e.key!==LS||e.newValue==null)return;
  const incoming=tryParse(e.newValue);
  if(!incoming||!incoming.cards)return;
  if(curScreen==='study'&&current){toast('Another tab changed your data — it will resync when you finish.');return;}
  try{
    state=migrate(incoming); state.cfg={...state_defaults,...state.cfg};
    document.body.dataset.theme=state.theme||'midnight';
    go(curScreen||'home'); updateStreakUI(); toast('Synced from another tab');
  }catch(_){}
});

/* ---------- first-run onboarding ---------- */
function showIntro(force){
  if(!force&&state.cfg.introSeen)return;
  const bg=document.createElement('div');
  bg.className='modal-bg on'; bg.id='introModal';
  bg.onclick=e=>{if(e.target===bg)closeIntro();};
  bg.innerHTML=`<div class="modal" style="max-width:480px">
    <h3>${ICON.bolt} Welcome to Yanal</h3>
    <p style="color:var(--text-2);font-size:13.5px;line-height:1.7;margin:-2px 0 16px">Yanal shows each card right before you'd forget it — so you study less and remember more. Here's the whole idea in 30 seconds:</p>
    <div class="intro-step"><span class="n">1</span><div><b>You rate how well you knew each answer.</b> Again, Hard, Good, or Easy.</div></div>
    <div class="intro-step"><span class="n">2</span><div><b>Yanal schedules the next review.</b> Knew it well? It waits longer. Struggled? It comes back soon.</div></div>
    <div class="intro-step"><span class="n">3</span><div><b>Intervals grow as memory strengthens</b> — days, then weeks, then months. The little <b>S · D · R%</b> on the answer shows the memory math.</div></div>
    <div class="intro-step"><span class="n">4</span><div><b>Just study a few minutes daily.</b> Import an Anki/CSV deck or add cards, then tap a deck to begin.</div></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:18px" onclick="closeIntro()">Got it — let's go</button>
  </div>`;
  document.body.appendChild(bg);
}
function closeIntro(){const m=$('#introModal');if(m)m.remove();if(!state.cfg.introSeen){state.cfg.introSeen=true;save();}}

/* ---------- init ---------- */
verifySeal();
if(isReadonly())document.body.classList.add('ro'); // hide editing UI in buyer edition
if(isStudyOnly()){ // locked study-only edition: strip to studying + show license
  document.body.classList.add('so');
  const lb=document.createElement('div');lb.className='lic-badge';
  lb.textContent=isSealed()?licenseLine():'Licensed copy — single user · do not distribute';
  document.body.appendChild(lb);
}
if(BUILD_LOCK_UI===true||isStudyOnly()){ // copy deterrent on buyer builds (does not impede studying)
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('dragstart',e=>{if(e.target&&e.target.tagName==='IMG')e.preventDefault();});
  document.addEventListener('keydown',e=>{
    const k=(e.key||'');
    if(k==='F12'||(e.ctrlKey&&e.shiftKey&&/^[IJC]$/i.test(k))||(e.ctrlKey&&/^[US]$/i.test(k))){e.preventDefault();}
  },true);
}
if(ensureDeckAncestors()>0)save(); // group any orphan sub-decks from earlier imports
updateStreakUI();
renderHome();
if(!isStudyOnly()&&!state.cfg.introSeen)setTimeout(showIntro,500); // first-run welcome (skipped in study-only)

/* Data-loss recovery: if localStorage was wiped (no cards) but the IndexedDB
   mirror still holds real data, restore it. Async, so it runs after first paint. */
(function recoverFromIdbIfEmpty(){
  if(state.cards&&state.cards.length)return; // localStorage is fine
  idbRecover().then(json=>{
    if(!json)return;
    const rec=tryParse(json);
    if(!rec||!rec.cards||!rec.cards.length)return;
    if(state.cards&&state.cards.length)return; // user added cards meanwhile
    try{
      state=migrate(rec); state.cfg={...state_defaults,...state.cfg}; if(!Array.isArray(state.exams))state.exams=[]; if(!state.images||typeof state.images!=='object')state.images={};
      ensureDeckAncestors(); save();
      document.body.dataset.theme=state.theme||'midnight';
      go('home'); updateStreakUI();
      setTimeout(()=>toast('Recovered your cards from on-device backup ✓'),400);
    }catch(_){}
  });
})();

</script>
